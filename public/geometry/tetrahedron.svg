<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Tetrahedron - 4 faces, element: Fire -->
  <defs>
    <linearGradient id="tetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:0.5" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Back face (dimmer) -->
  <path d="M 100 30 L 40 150 L 160 150 Z"
        stroke="#FF6B35" stroke-width="1.5" fill="url(#tetGrad)" opacity="0.3"/>

  <!-- Front faces -->
  <path d="M 100 30 L 40 150 L 100 120 Z"
        stroke="#FF6B35" stroke-width="2" fill="url(#tetGrad)" opacity="0.4" filter="url(#glow)"/>
  <path d="M 100 30 L 160 150 L 100 120 Z"
        stroke="#F7931E" stroke-width="2" fill="url(#tetGrad)" opacity="0.4" filter="url(#glow)"/>
  <path d="M 40 150 L 160 150 L 100 120 Z"
        stroke="#FF8C42" stroke-width="2.5" fill="url(#tetGrad)" opacity="0.5" filter="url(#glow)"/>

  <!-- Vertex highlights -->
  <circle cx="100" cy="30" r="3" fill="#FFD700" opacity="0.9" filter="url(#glow)"/>
  <circle cx="40" cy="150" r="3" fill="#FFD700" opacity="0.9"/>
  <circle cx="160" cy="150" r="3" fill="#FFD700" opacity="0.9"/>
  <circle cx="100" cy="120" r="3" fill="#FFD700" opacity="0.9"/>
</svg>
