<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Hexahedron (Cube) - 6 faces, element: Earth -->
  <defs>
    <linearGradient id="cubeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="cubeGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CD853F;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:0.3" />
    </linearGradient>
    <filter id="cubeGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Back faces (dimmer) -->
  <path d="M 60 80 L 140 80 L 140 160 L 60 160 Z"
        stroke="#8B4513" stroke-width="1.5" fill="url(#cubeGrad2)" opacity="0.3"/>

  <!-- Left face -->
  <path d="M 60 80 L 30 60 L 30 140 L 60 160 Z"
        stroke="#8B4513" stroke-width="2" fill="url(#cubeGrad1)" opacity="0.5" filter="url(#cubeGlow)"/>

  <!-- Right face -->
  <path d="M 140 80 L 170 60 L 170 140 L 140 160 Z"
        stroke="#D2691E" stroke-width="2" fill="url(#cubeGrad1)" opacity="0.5" filter="url(#cubeGlow)"/>

  <!-- Top face -->
  <path d="M 60 80 L 100 60 L 140 80 L 100 100 Z"
        stroke="#CD853F" stroke-width="2.5" fill="url(#cubeGrad2)" opacity="0.6" filter="url(#cubeGlow)"/>

  <!-- Front face outline -->
  <path d="M 60 80 L 140 80 L 140 160 L 60 160 Z"
        stroke="#D2691E" stroke-width="2.5" fill="none" opacity="0.8"/>

  <!-- Vertex highlights -->
  <circle cx="60" cy="80" r="3" fill="#FFD700" opacity="0.9"/>
  <circle cx="140" cy="80" r="3" fill="#FFD700" opacity="0.9"/>
  <circle cx="60" cy="160" r="3" fill="#FFD700" opacity="0.9"/>
  <circle cx="140" cy="160" r="3" fill="#FFD700" opacity="0.9"/>
  <circle cx="30" cy="60" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="170" cy="60" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="30" cy="140" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="170" cy="140" r="3" fill="#FFD700" opacity="0.8"/>
</svg>
