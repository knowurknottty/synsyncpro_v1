name: Import verified SynSync PWA snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-pwa-v1.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Import exact verified PWA tree
        env:
          SOURCE_URL: 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-fa84-81fb-b7c2-8f4b67cb989c/raw?se=2026-08-16T19%3A53%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=f8b23c0f-74f9-52b5-9f88-6486074a3a77&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-16T19%3A22%3A19Z&ske=2026-08-17T19%3A22%3A19Z&sks=b&skv=2026-02-06&sig=MUjH1GvxZOH13XiwAiJxWx7fuFijUhyOWDx5z/hGqEM%3D'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$SOURCE_URL" -o "$RUNNER_TEMP/source-artifact.zip"
          mkdir -p "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/source-artifact.zip" -d "$RUNNER_TEMP/artifact"
          tar -xzf "$RUNNER_TEMP/artifact/synsyncpro-v1-source-clean.tgz" -C "$RUNNER_TEMP/source"

          # Preserve this one-shot importer because Actions tokens cannot modify workflow files.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} + 2>/dev/null || true
          find .github/workflows -mindepth 1 -maxdepth 1 ! -name import-pwa-v1.yml -exec rm -rf {} + 2>/dev/null || true

          # Import every clean PWA file except workflow definitions; those are installed separately.
          rsync -a --exclude='.github/workflows/' "$RUNNER_TEMP/source/" ./

          git config user.name 'knowurknot'
          git config user.email 'knowurknottty@gmail.com'
          git add -A
          git commit -m 'chore: seed verified clean SynSync PWA snapshot'
          git push origin HEAD:main
